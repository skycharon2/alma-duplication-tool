[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alma-duplication-tool"
version = "0.1.0"
description = "A decision-support tool for checking possible duplication of ALMA observations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy",
    "astroquery",
    "pyvo",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "ipykernel",
    "matplotlib",
    "plotly>=6",
    "ipywidgets>=8",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires access to a live external service and is skipped by default",
]
