<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font:13px system-ui;color:#203e52;background:#f4f9fd}
header{display:flex;gap:12px;align-items:center;padding:10px;flex-wrap:wrap}
button{padding:6px 12px;cursor:pointer}
.sky-stage{position:relative;height:310px;width:100%}
#sky-geometry,#sky{position:absolute;inset:0;width:100%;height:100%}
#sky-geometry{display:block;background:#e8f2fa}
#sky{visibility:hidden}
#sky.sky-ready{visibility:visible}
#status{padding:0 10px}
</style></head>
<body><header><span>ICRS {{ '%.6f'|format(ra) }}°, {{ '%.6f'|format(dec) }}°</span><button id="reset" disabled>Reset view</button><button id="retry" type="button" hidden>Retry imagery</button></header>
<p id="status" role="status">Preparing coordinate preview…</p>
<div class="sky-stage"><canvas id="sky-geometry" width="480" height="310" aria-label="ICRS coordinate-only fallback"></canvas><div id="sky" data-ra="{{ ra }}" data-dec="{{ dec }}" data-aladin-module="{{ url_for('static', filename='vendor/aladin-lite/3.8.2/aladin.js') }}"></div></div>
<script src="{{ url_for('static', filename='alma-sky-runtime.js') }}"></script>
<script src="{{ url_for('static', filename='sky-preview-frame.js') }}"></script>
</body></html>
