name: Live Archive TAP smoke test

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: ALMA TAP endpoint
        required: true
        default: https://almascience.eso.org/tap
        type: string

permissions:
  contents: read

concurrency:
  group: live-archive-tap-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    name: Live ALMA TAP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run live Archive TAP smoke test
        env:
          ALMA_TAP_ENDPOINT: ${{ inputs.endpoint }}
        run: >-
          python -m pytest -q -s --run-live
          tests/live/test_archive_tap_smoke.py
