name: Persistence schema
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alma_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: alma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alma_test -d alma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALMA_TEST_DATABASE_URL: postgresql+psycopg://alma_test:test_only@localhost:5432/alma_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[persistence,auth,ui,test]'
      - run: python -m pytest -q tests/persistence
      - name: Verify browser cleanup systemd units
        run: |
          sudo install -d /srv/alma-duplication-tool/.venv/bin
          sudo ln -s "$(command -v python)" /srv/alma-duplication-tool/.venv/bin/python
          systemd-analyze --man=no verify \
            deploy/systemd/alma-browser-cleanup.service \
            deploy/systemd/alma-browser-cleanup.timer
